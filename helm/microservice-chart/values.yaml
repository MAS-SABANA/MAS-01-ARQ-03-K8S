# Valores por defecto del chart.
# Pueden ser sobreescritos con --set o con archivos -f values-<env>.yaml

replicaCount: 2

image:
  repository: santilp951/microservice-demo
  pullPolicy: IfNotPresent
  tag: "latest"                               # El pipeline actualizará este valor

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: microservice.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

env:
  SERVICE_NAME: "microservice-demo"
  SERVICE_VERSION: "1.0.0"
  PORT: "8080"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: false
  name: ""
